<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9-es Mentes Számtani Sorozat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .controls {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            width: 120px;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .canvas-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        .result-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f8f5;
            border-left: 5px solid #1abc9c;
            border-radius: 4px;
            font-size: 18px;
            display: none;
        }
        .result-panel span {
            font-weight: bold;
            color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>9-es Mentes Számtani Sorozat</h1>

    <div class="controls">
        <div class="input-group">
            <label for="a1">Első tag (a₁):</label>
            <input type="number" id="a1" value="1" min="1" step="1">
        </div>
        <div class="input-group">
            <label for="d">Differencia (d):</label>
            <input type="number" id="d" value="2" min="1" step="1">
        </div>
        <button onclick="startAnimation()">Animáció indítása</button>
    </div>

    <div class="canvas-container">
        <canvas id="numberLine" width="860" height="250"></canvas>
    </div>

    <div class="result-panel" id="resultPanel">
        A sorozat elakadt a(z) <span id="stopNumber"></span> számnál, mert az tartalmazza a 9-es számjegyet.<br>
        A 9-es nélküli, érvényes tagok száma: <strong id="validCount" style="color: #1abc9c;"></strong>
    </div>

    <script>
        const canvas = document.getElementById('numberLine');
        const ctx = canvas.getContext('2d');
        let animationTimer;

        // Rajzvászon beállítások
        const PADDING = 40;
        const CENTER_Y = 125;
        const START_X = PADDING;
        const END_X = canvas.width - PADDING;
        const WIDTH = END_X - START_X;

        function startAnimation() {
            // Töröljük a korábbi animációkat
            clearTimeout(animationTimer);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('resultPanel').style.display = 'none';

            const a1 = parseInt(document.getElementById('a1').value);
            const d = parseInt(document.getElementById('d').value);

            if (isNaN(a1) || isNaN(d) || a1 <= 0 || d <= 0) {
                alert("Kérlek, adj meg pozitív egész számokat az első tagnak és a differenciának is!");
                return;
            }

            // Sorozat kiszámítása
            let validTerms = [];
            let current = a1;
            let stopPoint = null;

            // Maximum iteráció a biztonság kedvéért, bár a 9-es biztosan előjön előbb-utóbb
            const MAX_ITER = 10000; 
            let iter = 0;

            while (iter < MAX_ITER) {
                if (current.toString().includes('9')) {
                    stopPoint = current;
                    break;
                }
                validTerms.push(current);
                current += d;
                iter++;
            }

            if (!stopPoint) {
                alert("Túl hosszú a sorozat, megszakítva a biztonság kedvéért.");
                return;
            }

            // Tengely végpontjának meghatározása (hogy kiférjen a piros pont és még egy kis hely)
            const maxVal = stopPoint + Math.max(d, Math.ceil(stopPoint * 0.05));
            
            drawAxis(maxVal);
            animatePoints(validTerms, stopPoint, maxVal);
        }

        // Segédfüggvény az X koordináta kiszámításához
        function getX(val, maxVal) {
            return START_X + (val / maxVal) * WIDTH;
        }

        // Számegyenes és beosztás megrajzolása
        function drawAxis(maxVal) {
            // Alap vonal
            ctx.beginPath();
            ctx.moveTo(START_X, CENTER_Y);
            ctx.lineTo(END_X, CENTER_Y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#34495e';
            ctx.stroke();

            // Nyíl a végén
            ctx.beginPath();
            ctx.moveTo(END_X, CENTER_Y);
            ctx.lineTo(END_X - 12, CENTER_Y - 6);
            ctx.lineTo(END_X - 12, CENTER_Y + 6);
            ctx.fillStyle = '#34495e';
            ctx.fill();

            // Dinamikus beosztás léptékének meghatározása
            let magnitude = Math.pow(10, Math.floor(Math.log10(maxVal)));
            let tickStep = magnitude;
            
            if (maxVal / tickStep <= 2) tickStep /= 10;
            else if (maxVal / tickStep <= 5) tickStep /= 5;
            else if (maxVal / tickStep <= 10) tickStep /= 2;

            if (tickStep < 1) tickStep = 1;

            ctx.font = '12px Arial';
            ctx.fillStyle = '#7f8c8d';
            ctx.textAlign = 'center';

            // Beosztás vonalak és számok
            for (let i = 0; i <= maxVal; i += tickStep) {
                let x = getX(i, maxVal);
                
                // Vonal
                ctx.beginPath();
                ctx.moveTo(x, CENTER_Y - 5);
                ctx.lineTo(x, CENTER_Y + 5);
                ctx.lineWidth = 1;
                ctx.stroke();

                // Felirat
                ctx.fillText(Math.round(i), x, CENTER_Y + 22);
            }
            
            // 0 pont mindig legyen kint, ha a lépték nem tenné ki
            let x0 = getX(0, maxVal);
            ctx.beginPath();
            ctx.moveTo(x0, CENTER_Y - 5);
            ctx.lineTo(x0, CENTER_Y + 5);
            ctx.stroke();
            ctx.fillText("0", x0, CENTER_Y + 22);
        }

        function drawPoint(val, maxVal, color, isStop = false) {
            let x = getX(val, maxVal);
            
            ctx.beginPath();
            ctx.arc(x, CENTER_Y, isStop ? 6 : 4, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            
            if (isStop) {
                // Külső kör a kiemeléshez
                ctx.beginPath();
                ctx.arc(x, CENTER_Y, 10, 0, 2 * Math.PI);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Szám kiírása a pont ALÁ, a beosztások alá, hogy jól látszódjon
                ctx.fillStyle = color;
                ctx.font = 'bold 16px Arial';
                ctx.fillText(val, x, CENTER_Y + 45); 
            }
        }

        // Animáció végrehajtása
        function animatePoints(validTerms, stopPoint, maxVal) {
            let currentIndex = 0;
            
            // Dinamikus sebesség: ha sok pont van, gyorsabb az animáció
            let delay = 400;
            if (validTerms.length > 10) delay = 200;
            if (validTerms.length > 50) delay = 50;
            if (validTerms.length > 150) delay = 10;

            function step() {
                if (currentIndex < validTerms.length) {
                    drawPoint(validTerms[currentIndex], maxVal, '#3498db');
                    currentIndex++;
                    animationTimer = setTimeout(step, delay);
                } else {
                    // Animáció vége, rajzoljuk ki a piros elakadási pontot
                    drawPoint(stopPoint, maxVal, '#e74c3c', true);
                    
                    // Eredmények megjelenítése a panelen
                    document.getElementById('stopNumber').innerText = stopPoint;
                    document.getElementById('validCount').innerText = validTerms.length;
                    document.getElementById('resultPanel').style.display = 'block';
                }
            }
            
            step();
        }
        
        // Első betöltéskor egy üres tengely kirajzolása (0-100 között)
        drawAxis(100);
    </script>
</body>
</html>
